name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Also applies the toolkit patches; a patch that no longer applies fails the install.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
